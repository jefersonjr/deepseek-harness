# Merge into user settings; choose an enabled Bedrock model for your account.
llm-pi-ai:
  providers:
    amazon-bedrock:
      bedrock:
        mode: failsafe
        maxRequestBytes: 80000
        maxOutputTokens: 512
        minOutputTokens: 128
        requestDeadlineMs: 75000
        totalDeadlineMs: 600000
        maxTotalAttempts: 12
        adaptiveTtlMs: 3600000
        outputReductionFactor: 0.5
        maxContinuations: 8
        maxRetries: 3
        # profile: work
        # region: us-east-1

# New Web sessions use the compact prompt/tool catalog. Existing sessions keep their preset.
agent-presets:
  modeSelectionEnabled: true
  default: bedrock
